apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gateway-api
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/YOUR_USER/gke-gitops.git
    targetRevision: main
    path: gateway-api

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
